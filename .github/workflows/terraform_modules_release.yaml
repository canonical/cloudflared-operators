name: Terraform modules release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_modules_release.yaml"

jobs:
  cloudflared-terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1  # main
    permissions:
      contents: write
    with:
      tag-prefix: cloudflared-tf-
      major-version-file: terraform/charm/cloudflared/MAJOR_VERSION
  cloudflare-configurator-terraform:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_release.yaml@030c5b20a0bb880dcf1ed326bff0fc16b6eb6ac1  # main
    permissions:
      contents: write
    with:
      tag-prefix: cloudflare-configurator-tf-
      major-version-file: terraform/charm/cloudflare_configurator/MAJOR_VERSION
