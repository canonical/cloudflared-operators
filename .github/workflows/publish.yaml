name: Publish to edge

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish-charm:
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@v0.0.1-alpha.10
    permissions:
      contents: write
      actions: read
    secrets: inherit
    with:
      channel: latest/edge
      integration-workflow-name: tests.yaml

  publish-snap:
    name: Publish snap to edge (${{ matrix.arch }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: snapcore/action-build@v1.3.0
        id: build
        with:
          path: ./charmed-cloudflared-snap
      - uses: snapcore/action-publish@v1.2.0
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPSTORE_TOKEN }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
