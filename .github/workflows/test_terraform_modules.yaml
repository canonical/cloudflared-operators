name: Terraform modules tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/terraform/**"
      - ".github/workflows/test_terraform_modules.yaml"

jobs:
  terraform-tests-lxd:
    uses: canonical/operator-workflows/.github/workflows/terraform_modules_test.yaml@95c819190372baf8338f3ed15b80ba76ec881136  # main
    secrets: inherit
    with:
      k8s-controller: false
      lxd-controller: true
      terraform-directories: '["terraform/charm/cloudflared", "terraform/charm/cloudflare_configurator"]'
